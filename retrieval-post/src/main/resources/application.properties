spring.application.name=retrieval-post
server.port=${SERVER_PORT:8084}

# Eureka: defaults to localhost for local runs, overridden in Docker Compose
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Postgres (no default password on purpose: set POSTGRES_PASSWORD)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:edupulse}
spring.datasource.username=${POSTGRES_USER:edupulse}
spring.datasource.password=${POSTGRES_PASSWORD}

# Embeddings via Ollama (no API key needed)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.model=${APP_EMBEDDING_MODEL:nomic-embed-text}

# Vector store: the table is created by ingest-static, never here
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=${EMBEDDING_DIMENSIONS:768}

# Needed by the Docker Compose healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Story 4, Task 1: Cross-encoder reranker configuration
app.rerank.enabled=${APP_RERANK_ENABLED:true}
app.rerank.top-n=${APP_RERANK_TOP_N:20}
app.rerank.top-k=${APP_RERANK_TOP_K:5}
app.rerank.model-id=${APP_RERANK_MODEL_ID:cross-encoder/ms-marco-MiniLM-L6-v2}
app.rerank.model-revision=${APP_RERANK_MODEL_REVISION:233902d25c440f23af6f7d6e94d2946bac0bee0a}
app.rerank.onnx-file=${APP_RERANK_ONNX_FILE:onnx/model.onnx}
app.rerank.onnx-sha256=${APP_RERANK_ONNX_SHA256:5d3e70fd0c9ff14b9b5169a51e957b7a9c74897afd0a35ce4bd318150c1d4d4a}
app.rerank.vocab-file=${APP_RERANK_VOCAB_FILE:vocab.txt}
app.rerank.model-cache-dir=${APP_RERANK_MODEL_CACHE_DIR:models/reranker}
app.rerank.auto-download=${APP_RERANK_AUTO_DOWNLOAD:true}
app.rerank.max-sequence-length=${APP_RERANK_MAX_SEQUENCE_LENGTH:512}
app.rerank.download-timeout-seconds=${APP_RERANK_DOWNLOAD_TIMEOUT_SECONDS:60}

# Story 4, Task 2: Neighbor stitching configuration
app.stitch.enabled=${APP_STITCH_ENABLED:true}
app.stitch.window-before=${APP_STITCH_WINDOW_BEFORE:1}
app.stitch.window-after=${APP_STITCH_WINDOW_AFTER:1}
app.stitch.max-token-budget=${APP_STITCH_MAX_TOKEN_BUDGET:2000}
app.stitch.min-overlap-chars=${APP_STITCH_MIN_OVERLAP_CHARS:15}
app.stitch.max-overlap-chars=${APP_STITCH_MAX_OVERLAP_CHARS:400}
app.stitch.vector-table-name=${APP_VECTOR_TABLE_NAME:vector_store}

# Story 4, Task 3: Citations, grounding, and similarity-threshold refusal
spring.ai.ollama.chat.options.model=${APP_CHAT_MODEL:llama3.2}
app.grounding.similarity-threshold=${APP_SIMILARITY_THRESHOLD:0.5}
app.grounding.refusal-message=${APP_GROUNDING_REFUSAL_MESSAGE:I don't know.}
app.grounding.chat-model=${APP_CHAT_MODEL:llama3.2}
app.grounding.chat-enabled=${APP_GROUNDING_CHAT_ENABLED:true}

# Story 4, Task 4: Evaluation harness and pre-merge regression gate
app.eval.golden-set-path=${APP_EVAL_GOLDEN_SET_PATH:/eval/golden-set.json}
app.eval.corpus-path=${APP_EVAL_CORPUS_PATH:/eval/corpus/compliance-chunks.json}
app.eval.baseline-report-path=${APP_EVAL_BASELINE_REPORT_PATH:eval/reports/baseline-report.json}
app.eval.min-recall-at-k=${APP_EVAL_MIN_RECALL_AT_K:0.90}
app.eval.min-mrr-at-k=${APP_EVAL_MIN_MRR_AT_K:0.85}
app.eval.min-faithfulness-rate=${APP_EVAL_MIN_FAITHFULNESS_RATE:0.90}
app.eval.min-refusal-accuracy=${APP_EVAL_MIN_REFUSAL_ACCURACY:1.00}
app.eval.min-support-ratio=${APP_EVAL_MIN_SUPPORT_RATIO:0.70}
app.eval.max-metric-drop=${APP_EVAL_MAX_METRIC_DROP:0.02}
