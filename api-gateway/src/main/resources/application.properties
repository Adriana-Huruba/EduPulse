spring.application.name=api-gateway
server.port=8080

# Eureka: defaults to localhost for local runs, overridden in Docker Compose
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Routes built from Eureka: /ingest-static/**, /retrieval-pre/**, ...
# (Spring Cloud 2025.0+ prefix: spring.cloud.gateway.server.webflux.*)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Needed by the Docker Compose healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
