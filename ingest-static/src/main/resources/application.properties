spring.application.name=ingest-static
server.port=${SERVER_PORT:8081}

# Eureka: defaults to localhost for local runs, overridden in Docker Compose
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Postgres (no default password on purpose: set POSTGRES_PASSWORD)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:edupulse}
spring.datasource.username=${POSTGRES_USER:edupulse}
spring.datasource.password=${POSTGRES_PASSWORD}

# LLM / embeddings (no default key: set LLM_API_KEY)
spring.ai.openai.api-key=${LLM_API_KEY}
spring.ai.openai.embedding.options.model=${APP_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.options.dimensions=${EMBEDDING_DIMENSIONS:1536}

# Vector store: ingest-static is the ONLY service that creates the table
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=${EMBEDDING_DIMENSIONS:1536}

# Needed by the Docker Compose healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
