spring.application.name=ingest-static
server.port=${SERVER_PORT:8081}

# Eureka: defaults to localhost for local runs, overridden in Docker Compose
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Postgres (no default password on purpose: set POSTGRES_PASSWORD)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:edupulse}
spring.datasource.username=${POSTGRES_USER:edupulse}
spring.datasource.password=${POSTGRES_PASSWORD}

# Embeddings via Ollama (no API key needed)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.model=${APP_EMBEDDING_MODEL:nomic-embed-text}

# Vector store: ingest-static is the ONLY service that creates the table
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=${EMBEDDING_DIMENSIONS:768}

# Needed by the Docker Compose healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Static PDF ingestion settings (configurable via environment variables)
app.ingest.chunk-size=${APP_CHUNK_SIZE:800}
app.ingest.chunk-overlap=${APP_CHUNK_OVERLAP:100}
app.ingest.pdf-dir=${APP_PDF_DIR:../resources}
app.ingest.embedding-model=${APP_EMBEDDING_MODEL:nomic-embed-text}
app.ingest.max-file-size-bytes=${APP_MAX_FILE_SIZE_BYTES:52428800}

# Multipart upload limits for PDF uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
